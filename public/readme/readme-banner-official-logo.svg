<svg width="1600" height="600" viewBox="0 0 1600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ambientGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(1190 300) rotate(180) scale(560 430)">
      <stop stop-color="#22C55E" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="bottomLine" x1="160" y1="0" x2="1440" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22C55E" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22C55E" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
    </linearGradient>

    <filter id="logoGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feFlood flood-color="#22C55E" flood-opacity="0.16" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="600" rx="32" fill="#090A0A"/>
  <rect width="1600" height="600" rx="32" fill="url(#ambientGlow)"/>

  <rect x="1" y="1" width="1598" height="598" rx="31" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2"/>

  <text x="160" y="165"
    fill="#22C55E"
    font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="27"
    font-weight="600"
    letter-spacing="8">
    SENIOR SOFTWARE ENGINEER
  </text>

  <text x="160" y="285"
    fill="#FFFFFF"
    font-family="Geist, Inter, Arial, sans-serif"
    font-size="82"
    font-weight="700"
    letter-spacing="-3">
    Alex Benavídez.
  </text>

  <text x="160" y="357"
    fill="#A3A3A3"
    font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="26"
    font-weight="400">
    Building scalable, reliable, and performant systems.
  </text>

  <text x="160" y="427"
    fill="#E5E5E5"
    font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="21"
    font-weight="500">
    Next.js  •  React  •  TypeScript  •  Tailwind CSS  •  Resend
  </text>

  <g transform="translate(160 476)">
    <rect width="348" height="60" rx="12" fill="#22C55E"/>
    <text x="34" y="38"
      fill="#07110A"
      font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
      font-size="21"
      font-weight="700">
      alexbenavidez.dev
    </text>
  </g>

  <!-- Official Forward monogram, embedded from forward-mark-dark.svg -->
  <g filter="url(#logoGlow)">
    <svg x="1080" y="118" width="330" height="330" viewBox="0 0 90.222916 82.285416"
      preserveAspectRatio="xMidYMid meet">
      <g transform="translate(-37.173958,-109.14062)">
        <path
          fill="#FFFFFF"
          stroke="#FFFFFF"
          stroke-width="0.556"
          stroke-linecap="round"
          stroke-linejoin="round"
          paint-order="stroke fill markers"
          d="m 39.738191,188.95238 17.118862,-35.20221 22.322546,-42.75048 0.398055,-0.006 46.318776,78.27944 -30.548755,0.0559 -9.383242,-3.30907 c 13.40663,-3.83262 21.118417,-8.3962 14.852377,-18.67582 -3.167817,-4.32119 -12.658475,-6.11852 -20.035709,-8.38599 l 10.063186,-4.26099 -11.604395,-20.26236 -21.712912,43.56181 11.01511,-0.0907 -5.982222,11.39924 -22.917835,0.032 z"/>
        <path
          fill="#22C55E"
          fill-rule="evenodd"
